<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Knowledge Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #131314;
      --bg-surface: #1e1f20;
      --bg-surface-hover: #282a2c;
      --text-main: #e3e3e3;
      --text-muted: #8e918f;
      --border-subtle: #333537;
      --accent-blue: #a8c7fa;
      --accent-blue-hover: #8ab4f8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      fill: var(--accent-blue);
      margin-bottom: 12px;
    }

    .brand-header h1 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }

    .brand-header p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent-blue);
    }

    .helptext {
      display: block;
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 5px;
      line-height: 1.4;
    }

    .errorlist {
      list-style: none;
      color: #f28b82;
      font-size: 0.8rem;
      margin-top: 5px;
    }

    .submit-btn {
      width: 100%;
      background: var(--accent-blue);
      color: #0b1329;
      border: none;
      border-radius: 20px;
      padding: 11px 0;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background: var(--accent-blue-hover);
    }

    .footer-links {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer-links a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-header">
      <svg class="brand-icon" viewBox="0 0 24 24">
        <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
      </svg>
      <h1>Create Account</h1>
      <p>Start indexing your documents and chatting with AI</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            {{ field.errors }}
          {% endif %}
          {% if field.help_text %}
            <span class="helptext">{{ field.help_text }}</span>
          {% endif %}
        </div>
      {% endfor %}

      <button type="submit" class="submit-btn">Register</button>
    </form>

    <div class="footer-links">
      Already have an account? <a href="{% url 'login' %}">Sign in</a>
    </div>
  </div>

</body>
</html>

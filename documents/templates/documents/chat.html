<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Knowledge Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-main: #131314;
      --bg-surface: #1e1f20;
      --bg-surface-hover: #282a2c;
      --text-main: #e3e3e3;
      --text-muted: #8e918f;
      --border-subtle: #333537;
      --accent-blue: #a8c7fa;
      --accent-blue-hover: #8ab4f8;
      --user-bubble: #282a2c;
      --sidebar-width: 268px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100dvh;
      width: 100%;
      display: flex;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Dark backdrop for mobile slide-over drawer */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 40;
      backdrop-filter: blur(2px);
    }
    .sidebar-backdrop.active { display: block; }

    aside {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      transition: width 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
      flex-shrink: 0;
      z-index: 50;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    aside.collapsed { width: 0; border: none; }

    .sidebar-header {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .new-chat-btn, .docs-mgr-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      min-height: 42px;
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .new-chat-btn:hover, .docs-mgr-btn:hover { background: var(--bg-surface-hover); }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.86rem;
      color: var(--text-muted);
      gap: 8px;
    }
    .session-item:hover, .session-item.active {
      background: var(--bg-surface-hover);
      color: var(--text-main);
    }
    .session-item .title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .session-item .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      min-width: 32px;
      min-height: 32px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
    }
    .session-item .delete-btn:hover {
      color: #f28b82;
      opacity: 1;
      background: rgba(242, 139, 130, 0.12);
    }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
      gap: 8px;
    }
    .user-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent-blue);
      color: #0b1329;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .user-name {
      font-size: 0.88rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .logout-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      min-width: 38px;
      min-height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logout-btn:hover { background: var(--bg-surface-hover); color: #f28b82; }
    .logout-btn svg { width: 19px; height: 19px; fill: currentColor; }

    .auth-buttons { display: flex; gap: 8px; width: 100%; }
    .auth-btn {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      border-radius: 18px;
      font-size: 0.84rem;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .auth-btn.login { background: var(--bg-surface-hover); color: var(--text-main); border: 1px solid var(--border-subtle); }
    .auth-btn.register { background: var(--accent-blue); color: #0b1329; }
    .auth-btn.register:hover { background: var(--accent-blue-hover); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    header {
      min-height: 56px;
      padding: env(safe-area-inset-top) 16px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      min-width: 42px;
      min-height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--bg-surface-hover); color: var(--text-main); }
    .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

    .brand-title {
      font-size: 1.02rem;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-overflow-scrolling: touch;
    }

    .chat-stream {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .message-row {
      display: flex;
      gap: 12px;
      width: 100%;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .message-row.user { justify-content: flex-end; }
    .message-row.user .bubble {
      background: var(--user-bubble);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 20px;
      border-bottom-right-radius: 4px;
      max-width: 82%;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .assistant-icon {
      width: 22px;
      height: 22px;
      margin-top: 4px;
      flex-shrink: 0;
      fill: var(--accent-blue);
    }

    .message-row.assistant .content {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .content h1, .content h2, .content h3 { margin: 12px 0 6px; color: #fff; font-size: 1.08rem; }
    .content p { margin-bottom: 8px; }
    .content ul, .content ol { padding-left: 20px; margin-bottom: 8px; }
    .content pre {
      background: var(--bg-surface);
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid var(--border-subtle);
    }
    .content code {
      background: var(--bg-surface);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.88em;
    }
    .content pre code { background: none; padding: 0; }

    .sources-container {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .source-chip {
      display: inline-block;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 4px 8px;
      margin: 4px 6px 2px 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
    }

    .input-wrapper {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding: 8px 14px calc(12px + env(safe-area-inset-bottom));
      flex-shrink: 0;
    }

    .input-capsule {
      background: var(--bg-surface);
      border-radius: 26px;
      padding: 6px 10px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      border: 1px solid var(--border-subtle);
    }
    .input-capsule:focus-within { border-color: var(--accent-blue); }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 16px; /* Prevents iOS Safari zoom-on-focus */
      line-height: 1.4;
      resize: none;
      max-height: 130px;
      padding: 9px 4px;
      min-width: 0;
    }
    textarea::placeholder { color: var(--text-muted); }
    input[type="file"] { display: none; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      max-height: 82dvh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-header h3 { color: #fff; font-size: 1.05rem; }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
      min-width: 36px;
      min-height: 36px;
    }
    .doc-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .doc-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg-main);
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      gap: 10px;
    }
    .doc-item > div { min-width: 0; flex: 1; }
    .doc-title {
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .doc-sub { font-size: 0.75rem; color: var(--text-muted); }
    .doc-delete-btn {
      background: none;
      border: none;
      color: #f28b82;
      cursor: pointer;
      font-size: 1.05rem;
      min-width: 36px;
      min-height: 36px;
      flex-shrink: 0;
    }

    /* 📱 Mobile Slide-Over Drawer & Layout Adjustments */
    @media (max-width: 768px) {
      aside {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 275px !important;
        max-width: 82%;
        transform: translateX(-100%);
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
      }
      aside.mobile-open { transform: translateX(0); }
      aside.collapsed { width: 275px !important; }

      header { padding: env(safe-area-inset-top) 10px 0; gap: 8px; }
      .chat-container { padding: 14px 12px; }
      .chat-stream { gap: 18px; }
      .message-row { gap: 10px; font-size: 0.94rem; }
      .message-row.user .bubble { max-width: 88%; padding: 10px 14px; }
      .input-wrapper { padding: 6px 10px calc(10px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" id="newChatBtn"><span>+</span> New chat</button>
      {% if request.user.is_authenticated %}
        <button class="docs-mgr-btn" id="openDocsBtn"><span>📁</span> Manage Docs</button>
      {% endif %}
    </div>
    <div class="session-list" id="sessionList"></div>

    <div class="sidebar-footer">
      {% if request.user.is_authenticated %}
        <div class="user-info">
          <div class="user-avatar">{{ request.user.username|slice:":1"|upper }}</div>
          <span class="user-name">{{ request.user.username }}</span>
        </div>
        <form method="POST" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="logout-btn" title="Sign out">
            <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
          </button>
        </form>
      {% else %}
        <div class="auth-buttons">
          <a href="{% url 'login' %}" class="auth-btn login">Sign In</a>
          <a href="{% url 'register' %}" class="auth-btn register">Register</a>
        </div>
      {% endif %}
    </div>
  </aside>

  <main>
    <header>
      <button class="icon-btn" id="toggleSidebarBtn" title="Toggle sidebar">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <span class="brand-title" id="chatTitle">Knowledge Assistant</span>
    </header>

    <div class="chat-container">
      <div class="chat-stream" id="chatStream"></div>
    </div>

    <div class="input-wrapper">
      <div class="input-capsule">
        <label for="fileInput" class="icon-btn" title="Upload document (.txt, .pdf)">
          <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5V6H9v9.5a3 3 0 0 0 6 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
        </label>
        <input type="file" id="fileInput" accept=".txt,.pdf" />
        <textarea id="userInput" rows="1" placeholder="Ask anything..."></textarea>
        <button class="icon-btn" id="sendBtn" title="Send message">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- 📁 Document Management Modal -->
  <div class="modal-overlay" id="docModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Uploaded Documents</h3>
        <button class="modal-close" id="closeDocModalBtn">✕</button>
      </div>
      <div class="doc-list" id="docList"></div>
    </div>
  </div>

  <script>
    const isAuthenticated = {{ request.user.is_authenticated|yesno:"true,false" }};

    function getCsrfToken() {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
          cookie = cookie.trim();
          if (cookie.startsWith('csrftoken=')) {
            cookieValue = decodeURIComponent(cookie.substring('csrftoken='.length));
            break;
          }
        }
      }
      return cookieValue;
    }

    let currentSessionId = null;

    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const sessionList = document.getElementById('sessionList');
    const chatTitle = document.getElementById('chatTitle');
    const chatStream = document.getElementById('chatStream');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');

    const openDocsBtn = document.getElementById('openDocsBtn');
    const docModal = document.getElementById('docModal');
    const closeDocModalBtn = document.getElementById('closeDocModalBtn');
    const docList = document.getElementById('docList');

    const THUNDER_ICON = `
      <svg class="assistant-icon" viewBox="0 0 24 24">
        <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
      </svg>
    `;

    function isMobileView() {
      return window.innerWidth <= 768;
    }

    function closeMobileSidebar() {
      sidebar.classList.remove('mobile-open');
      sidebarBackdrop.classList.remove('active');
    }

    toggleSidebarBtn.addEventListener('click', () => {
      if (isMobileView()) {
        const isOpen = sidebar.classList.toggle('mobile-open');
        sidebarBackdrop.classList.toggle('active', isOpen);
      } else {
        sidebar.classList.toggle('collapsed');
      }
    });

    sidebarBackdrop.addEventListener('click', closeMobileSidebar);

    // Touch swipe left to close mobile sidebar
    let touchStartX = 0;
    sidebar.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    sidebar.addEventListener('touchend', (e) => {
      if (isMobileView() && e.changedTouches[0].screenX - touchStartX < -55) {
        closeMobileSidebar();
      }
    }, { passive: true });

    window.addEventListener('resize', () => {
      if (!isMobileView()) closeMobileSidebar();
    });

    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 130) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !isMobileView()) {
        e.preventDefault();
        handleSubmit();
      }
    });

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function scrollToBottom() {
      const container = document.querySelector('.chat-container');
      container.scrollTop = container.scrollHeight;
    }

    function appendUserMessage(text) {
      const row = document.createElement('div');
      row.className = 'message-row user';
      row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
      chatStream.appendChild(row);
      scrollToBottom();
    }

    function createAssistantMessageRow() {
      const row = document.createElement('div');
      row.className = 'message-row assistant';
      row.innerHTML = `${THUNDER_ICON}<div class="content"></div>`;
      chatStream.appendChild(row);
      return row.querySelector('.content');
    }

    function renderSources(container, sources) {
      if (!sources || sources.length === 0) return;
      const box = document.createElement('div');
      box.className = 'sources-container';
      box.innerHTML = '<strong>Sources:</strong><br>' +
        sources.map(s => `<span class="source-chip">• ${escapeHtml(s.title)} (${s.distance})</span>`).join('');
      container.appendChild(box);
    }

    async function loadSessions() {
      if (!isAuthenticated) return;
      try {
        const res = await fetch('/api/sessions/');
        const data = await res.json();
        sessionList.innerHTML = '';

        data.sessions.forEach(sess => {
          const item = document.createElement('div');
          item.className = `session-item ${sess.id === currentSessionId ? 'active' : ''}`;
          item.innerHTML = `
            <span class="title">${escapeHtml(sess.title)}</span>
            <button class="delete-btn" title="Delete thread">✕</button>
          `;

          item.querySelector('.title').addEventListener('click', () => {
            switchSession(sess.id);
            closeMobileSidebar();
          });
          item.querySelector('.delete-btn').addEventListener('click', async (e) => {
            e.stopPropagation();
            await fetch(`/api/sessions/${sess.id}/`, {
              method: 'DELETE',
              headers: { 'X-CSRFToken': getCsrfToken() }
            });
            if (sess.id === currentSessionId) {
              startNewSession();
            } else {
              loadSessions();
            }
          });

          sessionList.appendChild(item);
        });
      } catch (e) {
        console.error("Failed to load sessions:", e);
      }
    }

    async function switchSession(sessionId) {
      currentSessionId = sessionId;
      const res = await fetch(`/api/sessions/${sessionId}/`);
      const data = await res.json();

      chatTitle.textContent = data.title;
      chatStream.innerHTML = '';

      data.messages.forEach(msg => {
        if (msg.role === 'user') {
          appendUserMessage(msg.content);
        } else {
          const contentDiv = createAssistantMessageRow();
          contentDiv.innerHTML = marked.parse(msg.content);
          renderSources(contentDiv, msg.sources);
        }
      });

      loadSessions();
      scrollToBottom();
    }

    async function startNewSession() {
      if (!isAuthenticated) return;
      try {
        const res = await fetch('/api/sessions/', {
          method: 'POST',
          headers: { 'X-CSRFToken': getCsrfToken() }
        });
        const data = await res.json();
        currentSessionId = data.id;
        chatTitle.textContent = data.title;
        chatStream.innerHTML = `
          <div class="message-row assistant">
            ${THUNDER_ICON}
            <div class="content"><p>Start a new conversation or upload a document to begin.</p></div>
          </div>
        `;
        closeMobileSidebar();
        loadSessions();
      } catch (e) {
        console.error("Failed to start session:", e);
      }
    }

    newChatBtn.addEventListener('click', () => {
      if (!isAuthenticated) {
        window.location.href = "{% url 'login' %}";
        return;
      }
      startNewSession();
    });

    async function handleSubmit() {
      const query = userInput.value.trim();
      if (!query) return;

      if (!isAuthenticated) {
        appendUserMessage(query);
        userInput.value = '';
        const contentDiv = createAssistantMessageRow();
        contentDiv.innerHTML = `<p>Please <a href="{% url 'login' %}" style="color:var(--accent-blue);">sign in</a> or <a href="{% url 'register' %}" style="color:var(--accent-blue);">register</a> to start chatting.</p>`;
        return;
      }

      appendUserMessage(query);
      userInput.value = '';
      userInput.style.height = 'auto';
      sendBtn.disabled = true;

      const contentDiv = createAssistantMessageRow();
      let rawMarkdown = '';
      let sources = [];

      try {
        const response = await fetch('/api/rag/stream/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCsrfToken()
          },
          body: JSON.stringify({ query: query, session_id: currentSessionId })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const payload = JSON.parse(line.replace('data: ', ''));
              if (payload.type === 'sources') {
                sources = payload.sources;
              } else if (payload.type === 'token') {
                rawMarkdown += payload.token;
                contentDiv.innerHTML = marked.parse(rawMarkdown);
                scrollToBottom();
              } else if (payload.type === 'done') {
                renderSources(contentDiv, sources);
                loadSessions();
              }
            }
          }
        }
      } catch (err) {
        contentDiv.innerHTML = `<p style="color:#f28b82;">⚠️ Request failed: ${escapeHtml(err.message)}</p>`;
      } finally {
        sendBtn.disabled = false;
        if (!isMobileView()) userInput.focus();
      }
    }

    sendBtn.addEventListener('click', handleSubmit);

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      if (!isAuthenticated) {
        const contentDiv = createAssistantMessageRow();
        contentDiv.innerHTML = `<p>Please <a href="{% url 'login' %}" style="color:var(--accent-blue);">sign in</a> to upload documents.</p>`;
        fileInput.value = '';
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      const contentDiv = createAssistantMessageRow();
      contentDiv.innerHTML = `<em>Processing and embedding "${escapeHtml(file.name)}"...</em>`;

      try {
        const res = await fetch('/api/upload/', {
          method: 'POST',
          headers: { 'X-CSRFToken': getCsrfToken() },
          body: formData
        });

        const data = await res.json();
        if (res.ok) {
          contentDiv.innerHTML = `<p>✅ <strong>${escapeHtml(data.message)}</strong> (${data.chunks_indexed} chunks stored)</p>`;
        } else {
          contentDiv.innerHTML = `<p style="color:#f28b82;">❌ Upload failed: ${escapeHtml(data.error || 'Server error')}</p>`;
        }
      } catch (err) {
        contentDiv.innerHTML = '<p style="color:#f28b82;">❌ Network error during upload.</p>';
      } finally {
        fileInput.value = '';
      }
    });

    async function loadUserDocuments() {
      docList.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">Loading documents...</p>';
      try {
        const res = await fetch('/api/documents/');
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        docList.innerHTML = '';

        if (!data.documents || data.documents.length === 0) {
          docList.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">No uploaded documents yet.</p>';
          return;
        }

        data.documents.forEach(doc => {
          const item = document.createElement('div');
          item.className = 'doc-item';
          item.innerHTML = `
            <div>
              <div class="doc-title">${escapeHtml(doc.filename)}</div>
              <div class="doc-sub">${doc.chunks} chunks indexed</div>
            </div>
            <button class="doc-delete-btn" title="Delete document">🗑️</button>
          `;

          item.querySelector('.doc-delete-btn').addEventListener('click', async () => {
            if (!confirm(`Delete "${doc.filename}" and its embeddings?`)) return;
            await fetch('/api/documents/delete/', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
              },
              body: JSON.stringify({ filename: doc.filename })
            });
            loadUserDocuments();
          });

          docList.appendChild(item);
        });
      } catch (err) {
        docList.innerHTML = `<p style="color:#f28b82; font-size:0.85rem;">Failed to load documents: ${escapeHtml(err.message)}</p>`;
      }
    }

    if (openDocsBtn) {
      openDocsBtn.addEventListener('click', () => {
        closeMobileSidebar();
        docModal.style.display = 'flex';
        loadUserDocuments();
      });
    }

    if (closeDocModalBtn) {
      closeDocModalBtn.addEventListener('click', () => {
        docModal.style.display = 'none';
      });
    }

    window.addEventListener('click', (e) => {
      if (e.target === docModal) docModal.style.display = 'none';
    });

    if (isAuthenticated) {
      startNewSession();
    } else {
      chatStream.innerHTML = `
        <div class="message-row assistant">
          ${THUNDER_ICON}
          <div class="content">
            <p>Welcome! Explore our Knowledge Assistant.</p>
            <p>Please <a href="{% url 'login' %}" style="color:var(--accent-blue);">Sign In</a> or <a href="{% url 'register' %}" style="color:var(--accent-blue);">Register</a> to save your sessions and upload custom documents.</p>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
